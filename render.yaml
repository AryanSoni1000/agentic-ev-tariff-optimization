# Render.com deployment configuration
# Deploy the FastAPI backend as a Web Service.
# The Streamlit dashboard can be deployed as a second Web Service
# pointing EV_API_BASE_URL at the first service's URL.

services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  - type: web
    name: ev-tariff-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /
    plan: free   # upgrade to starter for persistent disk

  # ── Streamlit dashboard ──────────────────────────────────────────────────────
  - type: web
    name: ev-tariff-dashboard
    runtime: python
    buildCommand: pip install streamlit requests
    startCommand: >
      streamlit run dashboard/app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
    envVars:
      - key: EV_API_BASE_URL
        value: https://ev-tariff-api.onrender.com   # replace with your API URL
    plan: free
